<style>
:root{
  --bg:#f4f2ee;--panel:#ffffff;--panel-2:#ebe8e2;--ink:#1d2126;--ink-2:#545b64;--ink-3:#868c94;
  --line:#dcd8d0;--accent:#c47a0b;--accent-soft:#f6e7cc;
  --doing:#2f6fb5;--doing-soft:#dce8f6;--blocked:#b8402f;--blocked-soft:#f6dcd7;
  --done:#2e7d4f;--done-soft:#d9eee1;--todo:#6b7280;--todo-soft:#e7e7ea;
  --late:#b8402f;--soon:#b06d00;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 2px 8px rgba(20,24,30,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181c;--panel:#1d2126;--panel-2:#252a30;--ink:#ece9e3;--ink-2:#aab0b8;--ink-3:#7c838c;
  --line:#30363d;--accent:#f0a83a;--accent-soft:#3a2f1c;
  --doing:#6aa5e8;--doing-soft:#1d2d40;--blocked:#ec7a68;--blocked-soft:#3e231f;
  --done:#62c48a;--done-soft:#1b3326;--todo:#9aa1aa;--todo-soft:#2a2f35;
  --late:#ec7a68;--soon:#f0a83a;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#15181c;--panel:#1d2126;--panel-2:#252a30;--ink:#ece9e3;--ink-2:#aab0b8;--ink-3:#7c838c;
  --line:#30363d;--accent:#f0a83a;--accent-soft:#3a2f1c;
  --doing:#6aa5e8;--doing-soft:#1d2d40;--blocked:#ec7a68;--blocked-soft:#3e231f;
  --done:#62c48a;--done-soft:#1b3326;--todo:#9aa1aa;--todo-soft:#2a2f35;
  --late:#ec7a68;--soon:#f0a83a;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 48px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:800 clamp(26px,4vw,38px)/1 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--ink-2);margin-top:6px;font-size:14px}
.src{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{background:var(--done);box-shadow:0 0 0 3px var(--done-soft)}
.dot.warn{background:var(--soon)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px;display:none}
.banner.show{display:block}

.films{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
@media (max-width:520px){.films{grid-template-columns:1fr 1fr}.film .t{font-size:12px}.film .meta{flex-wrap:wrap}}
.film{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow);transition:border-color .15s}
.film:hover{border-color:var(--ink-3)}
.film.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.film .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.film .id{font:800 20px/1 "Bricolage Grotesque",sans-serif}
.film .pct{font:500 14px "IBM Plex Mono",monospace;color:var(--ink-2)}
.film .t{font-size:13px;color:var(--ink-2);margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.film .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:8px;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--done-soft);color:var(--done)}
.chip.risk{background:var(--accent-soft);color:var(--soon)}
.chip.bad{background:var(--blocked-soft);color:var(--blocked)}
.filterline{display:flex;align-items:center;gap:10px;margin:-6px 0 14px;font-size:13px;color:var(--ink-2);min-height:28px}

.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.col{background:var(--panel-2);border-radius:14px;padding:10px;min-width:0}
.col h2{font:600 15px/1 "Bricolage Grotesque",sans-serif;margin:4px 4px 10px;display:flex;align-items:center;gap:8px}
.col h2 .n{font:500 12px "IBM Plex Mono",monospace;color:var(--ink-3)}
.col h2 .sw{width:10px;height:10px;border-radius:3px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--todo);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.card.doing{border-left-color:var(--doing)}
.card.blocked{border-left-color:var(--blocked)}
.card.done{border-left-color:var(--done)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .stage{font-weight:600}
.card .fid{font:500 12px "IBM Plex Mono",monospace;color:var(--accent);white-space:nowrap}
.card .note{font-size:13px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.card .row{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2);margin-top:8px}
.card .row b{font-weight:500;color:var(--ink)}
.card .prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.card .prog .bar{flex:1}
.card .prog .bar i{background:var(--doing)}
.card.blocked .prog .bar i{background:var(--blocked)}
.card .prog span{font:500 12px "IBM Plex Mono",monospace;color:var(--ink-2);min-width:3.5em;text-align:right}
.late{color:var(--late)!important;font-weight:600}
.soon{color:var(--soon)!important;font-weight:600}
.empty{font-size:13px;color:var(--ink-3);padding:10px 4px}
details.donegrp{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--done);border-radius:10px;padding:8px 12px}
details.donegrp summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none;font-size:14px}
details.donegrp summary::-webkit-details-marker{display:none}
details.donegrp summary .fid{font:500 12px "IBM Plex Mono",monospace;color:var(--accent)}
details.donegrp ul{margin:8px 0 2px;padding-left:18px;font-size:13px;color:var(--ink-2)}
details.donegrp li span{color:var(--ink-3)}

.lower{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-top:22px}
@media (max-width:900px){.lower{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.box h3{font:600 16px/1 "Bricolage Grotesque",sans-serif;margin:2px 0 10px}
.box ol{margin:0;padding-left:20px;font-size:14px}
.box ol li{margin-bottom:6px}
.credit{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.credit:first-of-type{border-top:0}
.credit .l{font:500 13px "IBM Plex Mono",monospace;text-align:right}
.credit .r{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
footer{margin-top:22px;font-size:12px;color:var(--ink-3)}
footer a{color:var(--ink-2)}
</style>

status":"done","note":"v01, 91.3"},"facts":{"status":"done"},"package":{"status":"done"},"vo":{"status":"todo","due":"2026-10-07"},"shorts_scripts":{"status":"done"},"shorts_vo":{"status":"todo","due":"2026-10-08"},"picture":{"status":"todo","due":"2026-11-15"},"edit":{"status":"todo","due":"2026-11-19"},"thumbnails":{"status":"todo","due":"2026-11-19"},"ben_ok":{"status":"todo","due":"2026-11-22"},"scheduled":{"status":"todo","due":"2026-11-23"}}},{"id":"010","title":"What Killed the Dinosaurs Was Hidden in a Line of Clay","air":"2026-12-03","ready_by":"2026-11-29","summary":"Script, facts, audit and package are done. Voiceover follows 009.","stages":{"topic":{"status":"done"},"script":{"status":"done","note":"v01, 92.1"},"facts":{"status":"done"},"package":{"status":"done"},"vo":{"status":"todo","due":"2026-10-07"},"shorts_scripts":{"status":"done"},"shorts_vo":{"status":"todo","due":"2026-10-08"},"picture":{"status":"todo","due":"2026-11-22"},"edit":{"status":"todo","due":"2026-11-26"},"thumbnails":{"status":"todo","due":"2026-11-26"},"ben_ok":{"status":"todo","due":"2026-11-29"},"scheduled":{"status":"todo","due":"2026-11-30"}}}]};
const REPO = {owner:"TheLaughingGod1986", repo:"history-of-science", path:"00_Brand/Channel-Setup/PIPELINE.json"};
const WORD = {done:"done", doing:"in progress", blocked:"blocked", todo:"to do", skip:"not needed"};
const DAY = 86400000;
let data = SNAPSHOT, source = "snapshot", fetchedAt = null, filter = null;
try { filter = localStorage.getItem("hos-kanban-film") || null; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
function pd(s){ if(!s) return null; const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return new Date(y,m-1,d); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function fd(d){ return d ? d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}) : "—"; }
function days(d){ return Math.round((d - today())/DAY); }
function cd(d){ if(!d) return ""; const n=days(d); return n<0?`${-n} d late`:n===0?"today":n===1?"tomorrow":`in ${n} d`; }
function cdCls(d){ if(!d) return ""; const n=days(d); return n<0?"late":n<=1?"soon":""; }

function progress(st){
  if(st.status==="done") return 1;
  if(typeof st.progress==="number") return st.progress;
  if(Array.isArray(st.steps)&&st.steps[1]) return st.steps[0]/st.steps[1];
  return 0;
}

const stOf = (f,s) => f.stages[s.key] || {status:"todo"};
function filmPct(f, stages){
  let tot=0, got=0;
  for(const s of stages){ const st=stOf(f,s); if(st.status==="skip") continue; tot+=s.weight;
    got+=s.weight*(st.status==="done"?1:(st.status==="doing"||st.status==="blocked")?progress(st):0); }
  return tot ? Math.round(100*got/tot) : 100;
}
function current(f, stages){
  for(const s of stages){ const st=stOf(f,s); if(st.status!=="done"&&st.status!=="skip") return [s,st]; }
  return null;

  if(stages.some(s=>stOf(f,s).status==="blocked")) return ["bad","blocked"];

  if(stages.some(s=>{ const st=stOf(f,s); return st.status!=="done"&&st.status!=="skip"&&st.due&&pd(st.due)<t; })) return ["risk","behind"];
  return ["ok","on track"];
}

function renderFilms(){
  const {films, stages} = data;
  $("films").innerHTML = films.map(f=>{
    const pct=filmPct(f,stages), [hc,ht]=health(f,stages), air=pd(f.air), cur=current(f,stages);

    </button>`;
  }).join("");
  $("films").querySelectorAll(".film").forEach(b=>b.onclick=()=>{
    filter = filter===b.dataset.film ? null : b.dataset.film;
    try { filter?localStorage.setItem("hos-kanban-film",filter):localStorage.removeItem("hos-kanban-film"); } catch(e){}
    render();
  });
  const f = films.find(x=>x.id===filter);
  $("filterline").innerHTML = f ? `Showing <b>&nbsp;${esc(f.id)}&nbsp;</b> only · ${md(f.summary||"")} <button class="btn" id="clear">Show all</button>` : "Tap a film to show only its cards.";
  if(f) $("clear").onclick=()=>{ filter=null; try{localStorage.removeItem("hos-kanban-film");}catch(e){} render(); };
}

function cardHtml(f, s, st){
  const p = progress(st), due=pd(st.due), eta=pd(st.eta);
  const bits=[];
  if(st.owner) bits.push(`Owner <b>${esc(st.owner)}</b>`);
  if(Array.isArray(st.steps)) bits.push(`<b>${st.steps[0]}/${st.steps[1]}</b> ${esc(st.steps_unit||"steps")}`);
  if(st.left) bits.push(`<b>${esc(st.left)}</b> left`);
  if(eta) bits.push(`ETA <b>${fd(eta)}</b> <span class="${cdCls(eta)}">(${cd(eta)})</span>`);
  if(due) bits.push(`Due <b>${fd(due)}</b> <span class="${cdCls(due)}">(${cd(due)})</span>`);
  const prog = (st.status==="doing"||st.status==="blocked") ? `<div class="prog"><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div><span>${Math.round(p*100)}%</span></div>` : "";
  return `<div class="card ${st.status}">
    <div class="hd"><span class="stage">${esc(s.label)}</span><span class="fid">${esc(f.id)}</span></div>
    ${filter?"":`<div class="note" style="margin-top:2px">${esc(f.title)}</div>`}
    ${prog}
    ${st.note?`<div class="note">${md(st.note)}</div>`:""}
    ${bits.length?`<div class="row">${bits.map(b=>`<span>${b}</span>`).join("")}</div>`:""}
  </div>`;
}

function renderBoard(){
  const {films, stages} = data;
  const shown = filter ? films.filter(f=>f.id===filter) : films;
  const cols = {blocked:[], doing:[], todo:[], done:[]};
  for(const f of shown) for(const [i,s] of stages.entries()){
    const st = stOf(f,s);
    if(st.status==="skip") continue;
    (cols[st.status]||cols.todo).push({f,s,st,i});
  }
  cols.todo.sort((a,b)=>(a.st.due||"9999").localeCompare(b.st.due||"9999") || a.f.id.localeCompare(b.f.id) || a.i-b.i);
  cols.doing.sort((a,b)=>(a.st.eta||a.st.due||"9999").localeCompare(b.st.eta||b.st.due||"9999"));
  const defs = [
    ...(cols.blocked.length?[["blocked","Blocked","var(--blocked)"]]:[]),
    ["doing","In progress","var(--doing)"],["todo","To do","var(--todo)"],["done","Done","var(--done)"]
  ];
  $("board").style.setProperty("--cols", defs.length);
  $("board").innerHTML = defs.map(([k,label,c])=>{
    let body;
    if(k==="done"){
      const byFilm = new Map();
      for(const x of cols.done){ if(!byFilm.has(x.f.id)) byFilm.set(x.f.id,{f:x.f,items:[]}); byFilm.get(x.f.id).items.push(x); }
      body = [...byFilm.values()].map(({f,items})=>`<details class="donegrp"${filter?" open":""}>
        <summary><span><span class="fid">${esc(f.id)}</span> ${items.length===stages.length?"every stage":items.length+" of "+stages.length+" stages"}</span><span>▾</span></summary>
        <ul>${items.map(x=>`<li>${esc(x.s.label)}${x.st.note?` <span>· ${md(x.st.note)}</span>`:""}</li>`).join("")}</ul></details>`).join("");
    } else {
      const list = k==="todo" && !filter ? cols.todo.slice(0,14) : cols[k];
      body = list.map(x=>cardHtml(x.f,x.s,x.st)).join("");
      if(k==="todo" && !filter && cols.todo.length>14) body += `<div class="empty">+ ${cols.todo.length-14} more later stages. Tap a film above to see all of its cards.</div>`;
    }
    return `<section class="col"><h2><span class="sw" style="background:${c}"></span>${label}<span class="n">${cols[k].length}</span></h2>
      <div class="cards">${body||`<div class="empty">Nothing here.</div>`}</div></section>`;
  }).join("");
}

function renderLower(){
  $("next").innerHTML = (data.next_steps||[]).map(s=>`<li>${md(s)}</li>`).join("");
  $("credits").innerHTML = (data.credits||[]).map(c=>`<div class="credit"><span>${esc(c.pool)}</span><span class="l">${esc(c.left)}</span><span class="r">${esc(c.rule)} · checked ${esc(c.checked)}</span></div>`).join("");
}

function renderSource(){
  const up = pd(data.updated);
  $("asof").textContent = `Board last updated ${fd(up)} by ${data.updated_by||"—"} · today is ${fd(today())}`;
  const dot=$("dot"), t=$("srctxt");
  dot.className = "dot" + (source==="live"?" live":source==="stale"?" warn":"");
  if(source==="live") t.textContent = `Live from GitHub · read ${new Date(fetchedAt).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}`;
  else if(source==="stale") t.textContent = `Last good read ${new Date(fetchedAt).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} · retrying`;
  else t.textContent = "Snapshot built into this page";
}

function render(){ if(!data) return; renderSource(); renderFilms(); renderBoard(); renderLower(); }

function banner(html){ const b=$("banner"); b.innerHTML=html||""; b.classList.toggle("show",!!html); }

function parsePipeline(result){
  const tryParse = s => { try { const j=JSON.parse(s); return j&&Array.isArray(j.films)?j:null; } catch(e){ return null; } };
  if(result.payload && typeof result.payload==="object" && Array.isArray(result.payload.films)) return result.payload;
  for(const b of result.content||[]){
    if(b.type==="text" && typeof b.text==="string"){ const j=tryParse(b.text); if(j) return j; }
    if(b.type==="resource" && b.resource && typeof b.resource.text==="string"){ const j=tryParse(b.resource.text); if(j) return j; }
  }
  return null;
}

function errorCopy(e){
  switch(e.code){
    case "server_not_connected": case "server_not_found":
      return "Showing the snapshot built into this page. To see live progress, connect the <b>GitHub</b> connector in claude.ai Settings → Connectors, then reopen this page.";
    case "needs_reauth":
      return "GitHub needs you to sign in again (claude.ai Settings → Connectors → GitHub). Showing the snapshot until then.";
    case "not_granted": case "consent_required": case "approval_required":
      return "This page reads progress from GitHub only if you allow it. Allow GitHub from this page's <b>Permissions</b> menu to see live progress. Showing the snapshot.";
    case "not_in_manifest": case "blocked_by_policy": case "capability_disabled": case "capability_removed":
      return "Live reading is turned off for this page. Showing the snapshot built into it.";
    default: return null;
  }
}

let unsub = null;
async function startLive(){
  let mcp = null;
  try { mcp = await window.claude?.use?.("mcp"); } catch(e){ mcp = null; }
  if(!mcp){ banner(SNAPSHOT?"":"Live data is not available here."); return; }
  const btn=$("refresh"); btn.hidden=false;
  btn.onclick = async()=>{ btn.disabled=true; try{ await mcp.invalidate?.("github","get_file_contents"); }catch(e){} setTimeout(()=>btn.disabled=false,1500); };
  unsub = mcp.watchTool("github","get_file_contents",REPO,ev=>{
    if(ev.type==="data"){
      const j = parsePipeline(ev.result);
      if(!j){ banner("GitHub answered, but the board file could not be read. Showing the last good data."); if(source==="live") source="stale"; render(); return; }
      data=j; source="live"; fetchedAt = ev.result.cache?.storedAt || Date.now(); banner(""); render();
    } else {
      const e=ev.error||{}; if(e.code==="user_changed"){ unsub&&unsub(); return; }
      const copy = errorCopy(e);
      if(copy){ if(source==="live"){ data=SNAPSHOT; source="snapshot"; } banner(copy); render(); }
      else { if(source==="live") source="stale"; banner("Couldn't reach GitHub just now. Showing the last good data; it will try again."); render(); }
    }
  },{refetchInterval:300000});
}

render();
startLive();
setInterval(()=>{ if(data) render(); }, 60*60*1000);
</script>
