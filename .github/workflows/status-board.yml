# Every film's status file must be in order, and no built page may be kept in the repo. Rules: AGENTS.md "Status board".
name: Status board

on:
  pull_request:
    paths:
      - "02_Video-Projects/*/status.json"
      - "00_Brand/Channel-Setup/BOARD.json"
      - "00_Brand/Channel-Setup/tools/status_board.py"
      - "00_Brand/Channel-Setup/tools/film_status.py"
      - "STATUS.md"
      - "00_Brand/Channel-Setup/kanban/**"
      - ".github/workflows/status-board.yml"

jobs:
  status-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The films' status files are in order
        run: python3 00_Brand/Channel-Setup/tools/status_board.py --check
      - name: The converter and the status tool still do what they promise
        run: python3 -m unittest tests.test_film_status tests.test_status_board -v
