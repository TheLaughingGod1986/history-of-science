name: Rules check

# AGENTS.md and studio/RULES.md are the sources of the sign-off order, the Never list and the channel's own rules.
# The copies in the always-on Cursor rule and the playbook are generated from them, and superseded wording is
# blocked, so the rules can't drift apart again.
on:
  push:
    branches: [main]
    paths: ["AGENTS.md", "studio/RULES.md", ".cursor/rules/**", "docs/**", "07_Content-Ops/**", "00_Brand/Channel-Setup/STUDIO_PLAYBOOK.md", "scripts/sync_rules.py", ".github/workflows/rules-check.yml"]
  pull_request:
    paths: ["AGENTS.md", "studio/RULES.md", ".cursor/rules/**", "docs/**", "07_Content-Ops/**", "00_Brand/Channel-Setup/STUDIO_PLAYBOOK.md", "scripts/sync_rules.py", ".github/workflows/rules-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_rules.py --check
